# Runs on every push and pull request: backend tests, frontend tests, and the production build.
# A red ❌ on a commit means something broke - fix it before deploying.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Tests use the in-memory database and an in-memory email outbox (see tests/conftest.py);
      # no real secrets, database or email account are needed in CI.
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      MONGODB_URL: mongomock://
      EMAIL_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check sample statements are reproducible
        run: |
          python sample_data/generate_samples.py
          python -m pytest -q tests/test_parsers.py

      - name: Run all backend tests
        run: python -m pytest -q --durations=5

  frontend:
    name: Frontend tests & build (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Production build
        run: npm run build
